bindsym --no-repeat {
#################################################################
# KEYBOARD BINDINGS FOR WM
#################################################################

# Move to Workspaces
  $mod+shift+1 move container to workspace number 1
  $mod+shift+2 move container to workspace number 2
  $mod+shift+3 move container to workspace number 3
  $mod+shift+4 move container to workspace number 4
  $mod+shift+5 move container to workspace number 5
  $mod+shift+6 move container to workspace number 6
  $mod+shift+7 move container to workspace number 7
  $mod+shift+8 move container to workspace number 8
  $mod+shift+9 move container to workspace number 9
 
# Move to next workspace
  $mod+alt+Right workspace next

# Move to previous workspace
  $mod+alt+Left workspace prev

# Move container to next monitor
  $mod+shift+greater move container to output right 

# Move active workspace to the next monitor
  $mod+shift+Right move workspace to output next

# Change Window Focus 
  $mod+h focus left

  $mod+j focus down

  $mod+k focus up

  $mod+l focus right

  $mod+Left focus left

  $mod+Down focus down

  $mod+Up focus up

  $mod+Right focus right

# Toggle Fullscreen
  $mod+f fullscreen toggle

# Toggle Fullscreen
  $mod+t floating toggle

# Toggle Focus (Tiling/Floating)
  $mod+space focus mode_toggle

# Focus Parent Container
  $mod+a focus parent

# Exit i3
  $mod+Shift+q exit

# Reload i3 Config
  $mod+Shift+c reload

# Restart i3
  $mod+Shift+r reload

# Resize Shrink Width
  $mod+Ctrl+h resize shrink width 3 px or 3 ppt

# Resize Grow Height
  $mod+Ctrl+j resize grow height 3 px or 3 ppt

# Resize Shrink Height
  $mod+Ctrl+k resize shrink height 3 px or 3 ppt

# Resize Grow Width
  $mod+Ctrl+l resize grow width 3 px or 3 ppt

# Resize Shrink Width
  $mod+Ctrl+Left resize shrink width 3 px or 3 ppt

# Resize Grow Height
  $mod+Ctrl+Down resize grow height 3 px or 3 ppt

# Resize Shrink Height
  $mod+Ctrl+Up resize shrink height 3 px or 3 ppt

# Resize Grow Width
  $mod+Ctrl+Right resize grow width 3 px or 3 ppt

# Layout Stacking
  $mod+s layout stacking

# Layout Tabbed
  $mod+w layout tabbed

# Layout Toggle Split
  $mod+e layout toggle split

# Split in horizontal orientation
  $mod+n split h

# Split in vertical orientation
  $mod+v split v

# Move to Scratchpad
  $mod+minus move scratchpad, scratchpad show, resize set width 1200 px height 800 px, move position center

# Show/Hide Scratchpad
  $mod+equal scratchpad show

# Move Scratchpad Back to Tiling
  $mod+Shift+equal floating disable

#################################################################
# SUPER + FUNCTION KEYS
#################################################################

#Thunar
  $mod+F8 exec thunar

#Rofi Fullscreen
  $mod+F11 exec rofi -theme-str 'window {width: 100%;height: 100%;}' -show drun

#Rofi
  $mod+F12 exec rofi -show drun -disable-history True

#Rofi disable history
  $mod+Shift+Return exec rofi -show drun

#################################################################
# SUPER + ... KEYS
#################################################################

#Xkill
  $mod+Escape exec xkill

# Kill focused window
  $mod+q kill

# Launch Terminal (alacritty)
  $mod+Return exec alacritty

# Power Menu
  $mod+x exec $HOME/.config/rofi/powermenu/type-1/powermenu.sh

# Power Modes
  $mod+m exec $HOME/.config/rofi/powermenu/type-2/powermenu.sh

#################################################################
# SUPER + SHIFT KEYS
#################################################################

#dmenu
#$mod+Shift+d exec dmenu_run -i -nb '#191919' -nf '#fea63c' -sb '#fea63c' -sf '#191919' -fn 'NotoMonoRegular:bold:pixelsize=14'

#dmenu
  $mod+d exec rofi -no-config -no-lazy-grab -show drun -disable-history True -modi drun -theme ~/.config/rofi/launcher8.rasi

#reload sxhkd:
  $mod+Shift+s reload

#################################################################
# CONTROL + ALT KEYS
#################################################################

#File-Manager
  Ctrl+Alt+f exec thunar

#Nitrogen
  Ctrl+Alt+i exec nitrogen

#Xfce4-settings-manager
  Ctrl+Alt+m exec xfce4-settings-manager

#Pulse Audio Control
  Ctrl+Alt+u exec pavucontrol

#Rofi theme selector
  Ctrl+Alt+r exec rofi-theme-selector

#alacritty
  Ctrl+Alt+t exec alacritty

#################################################################
#     SCREENSHOTS
#################################################################

#flameshoot
  Ctrl+Print exec flameshoot gui

#################################################################
#     MULTIMEDIA KEYS
#################################################################

#Raises volume
  XF86AudioRaiseVolume exec amixer set Master 5%+

#Lowers volume
  XF86AudioLowerVolume exec amixer set Master 5%-

#Mute
  XF86AudioMute exec amixer -D pulse set Master 1+ toggle

#Playerctl works for Pragha, Spotify and others
#Delete the line for playerctl if you want to use mpc
#and replace it with the corresponding code
#mpc works for e.g.ncmpcpp
#mpc toggle
#mpc next
#mpc prev
#mpc stop

#PLAY
  XF86AudioPlay exec playerctl play-pause

#Next
  XF86AudioNext exec playerctl next

#previous
  XF86AudioPrev exec playerctl previous

#Stop
  XF86AudioStop exec playerctl stop

#Brightness up
#XF86MonBrightnessUp
#    brightnessctl set +5%

#Brightness down
#XF86MonBrightnessDown
#    brightnessctl set -5%

  $mod+F5 exec brave-browser
}
# switch Workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9

