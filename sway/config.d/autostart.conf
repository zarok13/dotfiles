exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP QT_QPA_PLATFORM=wayland
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP QT_QPA_PLATFORM=wayland

exec_always systemctl --user stop xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk
exec_always systemctl --user start xdg-desktop-portal-wlr xdg-desktop-portal-gtk
exec_always systemctl --user start xdg-desktop-portal

exec "waybar -c ~/.config/sway/waybar/config.jsonc -s ~/.config/sway/waybar/style.css"

#exec_always autotiling
exec "sleep 2 && nm-applet --indicator"
exec "sleep 2 && udiskie -t --no-menu-checkbox-workaround"
exec "sleep 2 && blueman-applet"
exec swaybg -i ~/Pictures/Wallpapers/nebula_space_stars_171352_1920x1080.jpg -m fill
exec firewall-applet
exec lxpolkit
exec env XDG_SESSION_DESKTOP=sway conky -c ~/.config/sway/conky/conky.conf
exec flameshot
exec gammastep-indicator -c ~/.config/gammastep/config_wayland.ini
#exec ibus-daemon -rxRd
exec sudo balance.sh
# exec_always wl-paste --watch cliphist -max-items 10 store


