general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 3
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 0
    dots_size = 0.25
    fade_on_empty = true
    placeholder_text = Password...
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    font_size = 22
    position = 0, 20
    halign = center
    valign = center
}
