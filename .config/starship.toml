palette = "gruvbox_dark"

format = """
[](fg:bg0)\
$shell\
$php\
$python\
$username\
[](bg:bg2 fg:bg0)\
$directory\
[](fg:bg2 bg:bg3)\
$git_branch\
$git_status\
[](fg:bg3 bg:aqua)\
$docker_context\
[](fg:aqua bg:blue)\
$time\
[ ](fg:blue)\
"""

[palettes.gruvbox_dark]
bg0    = "#282828"
bg1    = "#3c3836"
bg2    = "#504945"
bg3    = "#665c54"
bg4    = "#7c6f64"
fg0    = "#fbf1c7"
fg1    = "#ebdbb2"
red    = "#cc241d"
green  = "#b8bb26"
yellow = "#fabd2f"
blue   = "#458588"
aqua   = "#689d6a"
orange = "#d65d0e"

[shell]
style = "bg:bg0 fg:red"
disabled = false
bash_indicator = ' '
fish_indicator = '󰈺 '
zsh_indicator = ' '
format = '[$indicator ]($style)'

[username]
show_always = true
style_user = "bg:bg0 fg:red bold"
style_root = "bg:bg0 fg:orange bold"
format = '[$user ]($style)'

[directory]
style = "bg:bg2 fg:yellow bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = " 󰈙  "
"Downloads" = "   "
"Music" = "   "
"Pictures" = "   "

[git_branch]
symbol = ""
style = "bg:bg3 fg:green bold"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:bg3 fg:orange bold"
format = '[$all_status$ahead_behind ]($style)'

[docker_context]
symbol = " "
style = "bg:aqua fg:bg0"
format = '[ $symbol $context ]($style)$path'

[python]
style = "bg:bg0 fg:yellow bold"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[php]
style = "bg:bg0 fg:orange bold"
format = '[$symbol($version )]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:blue fg:fg0 bold"
format = '[ $time ]($style)'

